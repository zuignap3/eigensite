# Bewerken via https://app.pagescms.org (inloggen met GitHub)
# Alleen de eigenaar van de GitHub-repository kan deze inhoud publiceren.
media:
  input: media
  output: /media
  rename: safe
content:
  - name: portfolio
    label: Portfolioprojecten
    type: file
    path: data/portfolio.json
    format: json
    list: true
    fields:
      - name: titel
        label: Projectnaam
        type: string
        required: true
      - name: categorie
        label: Categorie
        type: string
        required: true
      - name: slug
        label: Vaste linknaam (optioneel, uniek per pagina)
        type: string
        description: "Bijvoorbeeld: mijn-eerste-video. Als je dit leeg laat, wordt de projecttitel gebruikt."
      - name: jaar
        label: Jaar
        type: string
      - name: samenvatting
        label: Korte beschrijving (op de kaart)
        type: text
      - name: beschrijving
        label: Uitgebreide beschrijving
        type: text
      - name: afbeelding
        label: Omslagafbeelding
        type: image
      - name: video
        label: Videolink (YouTube of Vimeo)
        type: string
      - name: link
        label: Link naar het project
        type: string
      - name: blokken
        label: Inhoud van de projectpagina (sleep blokken in de gewenste volgorde)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{soort} — {kop}"
        fields:
          - name: soort
            label: Soort blok
            type: select
            options:
              values: [Tekst, Afbeelding, Video]
          - name: kop
            label: Kop (optioneel)
            type: string
          - name: tekst
            label: Tekst (voor een tekstblok)
            type: text
          - name: afbeelding
            label: Afbeelding (voor een afbeeldingsblok)
            type: image
          - name: bijschrift
            label: Bijschrift (optioneel)
            type: string
          - name: video
            label: YouTube- of Vimeo-link (voor videoblok)
            type: string

  - name: projecten
